<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1.0"><title>TikCare</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#0d0f12;color:#f0f2f5;padding:18px;width:240px}.logo{display:flex;align-items:center;gap:8px;margin-bottom:14px}.logo-icon{width:28px;height:28px;background:#4f8ef7;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px}.logo-text{font-size:1rem;font-weight:700}.status-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid#2a2f3d;font-size:.82rem}.status-row:last-of-type{border-bottom:none}.label{color:#8b93a7}.badge{font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:100px}.badge--active{background:#34c77b26;color:#34c77b}.badge--locked{background:#e8445a1f;color:#e8445a}.btn{display:block;width:100%;margin-top:14px;padding:10px;border:none;border-radius:7px;font-size:.875rem;font-weight:600;cursor:pointer;transition:background.15s}.btn--primary{background:#4f8ef7;color:#fff}.btn--primary:hover{background:#3a7ae4}.btn--primary:focus-visible{outline:2px solid#4f8ef7;outline-offset:3px}</style></head><body>
  <div class=logo>
    <div class=logo-icon aria-hidden=true>🛡</div>
    <span class=logo-text>TikCare</span>
  </div>

  <div class=status-row>
    <span class=label>Protection</span>
    <span class="badge badge--active">Active</span>
  </div>
  <div class=status-row>
    <span class=label>Mode</span>
    <span class="badge badge--locked" id=mode-badge>—</span>
  </div>

  <button class="btn btn--primary" id=open-dashboard-btn>Open Parent Dashboard</button>

  <script src=popup.js></script>



</body></html>
